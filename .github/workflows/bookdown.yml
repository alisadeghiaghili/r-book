name: bookdown

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bookdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install bookdown
        run: |
          install.packages(c("bookdown", "rmarkdown", "knitr", "downlit", "xml2", "bslib", "sass", "jsonlite"))
        shell: Rscript {0}

      - name: Prepare chapter sources
        run: |
          Rscript scripts/prepare_book.R

      - name: Render book
        run: |
          Rscript -e 'bookdown::render_book("index.Rmd", output_format = "bookdown::bs4_book", output_dir = "_book", quiet = TRUE)'

      - name: Deploy to GitHub Pages (gh-pages)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          force_orphan: true
          commit_message: "chore: publish bookdown site"

